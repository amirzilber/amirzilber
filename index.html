<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>שעון עצר</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            -webkit-box-sizing: border-box;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            background: -webkit-linear-gradient(315deg, #ffe0ec 0%, #ffc2d9 30%, #ffb3d0 60%, #ffd6e7 100%);
            background: linear-gradient(135deg, #ffe0ec 0%, #ffc2d9 30%, #ffb3d0 60%, #ffd6e7 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        .balloons-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            bottom: -160px;
            will-change: transform, opacity;
            -webkit-animation: floatUp linear infinite;
            animation: floatUp linear infinite;
            z-index: 0;
        }

        @-webkit-keyframes floatUp {
            0% {
                -webkit-transform: translateY(0) translateX(0) rotate(0deg);
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.85;
            }
            25% {
                -webkit-transform: translateY(-25vh) translateX(15px) rotate(3deg);
                transform: translateY(-25vh) translateX(15px) rotate(3deg);
            }
            50% {
                -webkit-transform: translateY(-50vh) translateX(-10px) rotate(-2deg);
                transform: translateY(-50vh) translateX(-10px) rotate(-2deg);
            }
            75% {
                -webkit-transform: translateY(-75vh) translateX(12px) rotate(2deg);
                transform: translateY(-75vh) translateX(12px) rotate(2deg);
            }
            100% {
                -webkit-transform: translateY(-120vh) translateX(-8px) rotate(-1deg);
                transform: translateY(-120vh) translateX(-8px) rotate(-1deg);
                opacity: 0.2;
            }
        }

        @keyframes floatUp {
            0% {
                -webkit-transform: translateY(0) translateX(0) rotate(0deg);
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0.85;
            }
            25% {
                -webkit-transform: translateY(-25vh) translateX(15px) rotate(3deg);
                transform: translateY(-25vh) translateX(15px) rotate(3deg);
            }
            50% {
                -webkit-transform: translateY(-50vh) translateX(-10px) rotate(-2deg);
                transform: translateY(-50vh) translateX(-10px) rotate(-2deg);
            }
            75% {
                -webkit-transform: translateY(-75vh) translateX(12px) rotate(2deg);
                transform: translateY(-75vh) translateX(12px) rotate(2deg);
            }
            100% {
                -webkit-transform: translateY(-120vh) translateX(-8px) rotate(-1deg);
                transform: translateY(-120vh) translateX(-8px) rotate(-1deg);
                opacity: 0.2;
            }
        }

        .balloon svg {
            display: block;
            filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.12));
            -webkit-filter: drop-shadow(1px 2px 3px rgba(0,0,0,0.12));
        }

        .balloon-string {
            display: block;
            margin: 0 auto;
            width: 1.5px;
            height: 50px;
            background: rgba(200, 130, 160, 0.5);
        }

        .countdown-wrapper {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 15px;
            width: 100%;
            max-width: 600px;
        }

        .title {
            font-size: 7vw;
            color: #d4548a;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(255, 255, 255, 0.7);
            font-weight: 700;
        }

        .countdown-display {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: row;
            flex-direction: row;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            gap: 6px;
            direction: ltr;
        }

        .time-unit {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            flex-direction: column;
            -webkit-align-items: center;
            align-items: center;
        }

        .time-value {
            font-size: 11vw;
            font-weight: 800;
            color: #fff;
            background: -webkit-linear-gradient(315deg, #f8b4cc, #f799b8);
            background: linear-gradient(135deg, #f8b4cc, #f799b8);
            padding: 8px 12px;
            border-radius: 14px;
            min-width: 18vw;
            text-align: center;
            -webkit-box-shadow: 0 6px 20px rgba(213, 84, 138, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.5);
            box-shadow: 0 6px 20px rgba(213, 84, 138, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.5);
            text-shadow: 2px 2px 4px rgba(180, 60, 110, 0.3);
            line-height: 1.3;
        }

        .time-label {
            font-size: 3vw;
            color: #c44e80;
            margin-top: 5px;
            font-weight: 600;
        }

        .separator {
            font-size: 8vw;
            color: #e888aa;
            font-weight: 800;
            padding-bottom: 20px;
            -webkit-animation: pulse 1s ease-in-out infinite;
            animation: pulse 1s ease-in-out infinite;
        }

        @-webkit-keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .target-time {
            margin-top: 25px;
            font-size: 3.8vw;
            color: #d6006f;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.45);
            padding: 10px 18px;
            border-radius: 25px;
            -webkit-box-shadow: 0 3px 12px rgba(214, 0, 111, 0.15);
            box-shadow: 0 3px 12px rgba(214, 0, 111, 0.15);
            direction: rtl;
            display: inline-block;
        }

        .finished-message {
            display: none;
            font-size: 9vw;
            color: #d4548a;
            font-weight: 800;
            text-shadow: 2px 2px 6px rgba(255, 255, 255, 0.7);
            -webkit-animation: celebratePulse 0.8s ease-in-out infinite alternate;
            animation: celebratePulse 0.8s ease-in-out infinite alternate;
        }

        @-webkit-keyframes celebratePulse {
            0% { -webkit-transform: scale(1); transform: scale(1); }
            100% { -webkit-transform: scale(1.08); transform: scale(1.08); }
        }

        @keyframes celebratePulse {
            0% { -webkit-transform: scale(1); transform: scale(1); }
            100% { -webkit-transform: scale(1.08); transform: scale(1.08); }
        }

        /* Desktop */
        @media (min-width: 600px) {
            .title { font-size: 2.5rem; }
            .time-value { font-size: 5rem; padding: 15px 25px; min-width: 120px; border-radius: 18px; }
            .time-label { font-size: 1.1rem; }
            .separator { font-size: 3.5rem; }
            .target-time { font-size: 1.3rem; }
            .countdown-display { gap: 15px; }
            .finished-message { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <div class="balloons-container" id="bc"></div>

    <div class="countdown-wrapper">
        <div class="title">&#9203; שעון עצר &#9203;</div>

        <div class="countdown-display" id="cd">
            <div class="time-unit">
                <div class="time-value" id="d">00</div>
                <div class="time-label">ימים</div>
            </div>
            <div class="separator">:</div>
            <div class="time-unit">
                <div class="time-value" id="h">00</div>
                <div class="time-label">שעות</div>
            </div>
            <div class="separator">:</div>
            <div class="time-unit">
                <div class="time-value" id="m">00</div>
                <div class="time-label">דקות</div>
            </div>
            <div class="separator">:</div>
            <div class="time-unit">
                <div class="time-value" id="s">00</div>
                <div class="time-label">שניות</div>
            </div>
        </div>

        <div class="finished-message" id="fm">&#127881; הזמן הגיע! &#127881;</div>

        <div class="target-time">
            &#128336; שעת היעד בישראל: 06:59 בבוקר, 19/02/2026
        </div>
    </div>

    <script>
        // Target: 18/02/2026 23:59:00 New York time (EST, UTC-5)
        // In UTC: 19 Feb 2026 04:59:00
        var TARGET_MS = Date.UTC(2026, 1, 19, 4, 59, 0);

        var dE = document.getElementById('d');
        var hE = document.getElementById('h');
        var mE = document.getElementById('m');
        var sE = document.getElementById('s');
        var cdE = document.getElementById('cd');
        var fmE = document.getElementById('fm');

        function pad(n) {
            return n < 10 ? '0' + n : '' + n;
        }

        function tick() {
            var diff = TARGET_MS - Date.now();
            if (diff <= 0) {
                dE.textContent = '00';
                hE.textContent = '00';
                mE.textContent = '00';
                sE.textContent = '00';
                cdE.style.display = 'none';
                fmE.style.display = 'block';
                return;
            }
            var t = Math.floor(diff / 1000);
            dE.textContent = pad(Math.floor(t / 86400));
            hE.textContent = pad(Math.floor((t % 86400) / 3600));
            mE.textContent = pad(Math.floor((t % 3600) / 60));
            sE.textContent = pad(t % 60);
        }

        tick();

        // Use both setInterval and requestAnimationFrame for reliability in WebViews
        setInterval(tick, 500);

        // Also use requestAnimationFrame as backup - WebView may throttle setInterval
        (function rafLoop() {
            tick();
            requestAnimationFrame(rafLoop);
        })();

        // Also re-tick on visibility change (WhatsApp WebView pauses timers)
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) { tick(); }
        }, false);

        // Balloon system - lightweight SVG-based for mobile performance
        var bc = document.getElementById('bc');
        var pinkColors = ['#f5a0b8','#f7b0c4','#f299ae','#efa3ba','#f0889e','#f4b8ca','#e8909f','#f5c0d0'];
        var maxBalloons = 12;
        var balloonCount = 0;

        function heartSVG(color, w) {
            return '<svg width="' + w + '" height="' + Math.round(w * 0.9) + '" viewBox="0 0 100 90">' +
                '<path d="M50 85C25 60 0 40 0 25 0 10 12 0 25 0c10 0 20 8 25 18C55 8 65 0 75 0c13 0 25 10 25 25 0 15-25 35-50 60z" fill="' + color + '"/>' +
                '</svg>';
        }

        function roundSVG(color, w) {
            var h = Math.round(w * 1.25);
            return '<svg width="' + w + '" height="' + (h + 10) + '" viewBox="0 0 ' + w + ' ' + (h + 10) + '">' +
                '<ellipse cx="' + (w/2) + '" cy="' + (h/2) + '" rx="' + (w/2) + '" ry="' + (h/2) + '" fill="' + color + '"/>' +
                '<polygon points="' + (w/2 - 5) + ',' + h + ' ' + (w/2 + 5) + ',' + h + ' ' + (w/2) + ',' + (h + 9) + '" fill="' + color + '"/>' +
                '</svg>';
        }

        function makeBalloon() {
            if (balloonCount >= maxBalloons) return;
            balloonCount++;

            var el = document.createElement('div');
            el.className = 'balloon';
            var color = pinkColors[Math.floor(Math.random() * pinkColors.length)];
            var isHeart = Math.random() > 0.5;
            var size = 35 + Math.floor(Math.random() * 25);

            var svg = isHeart ? heartSVG(color, size) : roundSVG(color, size);
            el.innerHTML = svg + '<div class="balloon-string"></div>';

            el.style.left = (5 + Math.random() * 90) + '%';
            var dur = 9 + Math.random() * 9;
            el.style.animationDuration = dur + 's';
            el.style.webkitAnimationDuration = dur + 's';
            el.style.animationDelay = (Math.random() * 1.5) + 's';
            el.style.webkitAnimationDelay = (Math.random() * 1.5) + 's';

            bc.appendChild(el);

            setTimeout(function() {
                if (el.parentNode) el.parentNode.removeChild(el);
                balloonCount--;
            }, (dur + 2) * 1000);
        }

        // Stagger initial balloons
        for (var i = 0; i < 8; i++) {
            (function(idx) {
                setTimeout(function() { makeBalloon(); }, idx * 700);
            })(i);
        }

        // Continuous creation
        setInterval(function() { makeBalloon(); }, 2000);
    </script>
</body>
</html>
